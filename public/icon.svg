<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular border -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.18"/>
  <circle cx="256" cy="256" r="205" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 6"/>

  <!-- Wheat Spikes Art (سنابل القمح) with filter -->
  <g filter="url(#glow)">
    <!-- Left Wheat Spike -->
    <g transform="translate(220, 240) rotate(-22) translate(-220, -240)">
      <!-- Stem -->
      <path d="M220 370 Q 220 250 215 110" stroke="#fde68a" stroke-width="6" stroke-linecap="round" fill="none"/>
      <!-- Whiskers/Awns -->
      <path d="M215 110 L205 60 M215 110 L225 60 M215 110 L215 50" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M195 140 L160 115 M235 155 L270 130" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <path d="M190 180 L150 160 M240 195 L280 175" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <path d="M188 220 L145 205 M242 235 L285 220" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <path d="M190 260 L150 250 M240 275 L280 265" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <!-- Top Grain -->
      <ellipse cx="215" cy="110" rx="14" ry="22" transform="rotate(0 215 110)" fill="url(#gold1)" stroke="#ffffff" stroke-width="2"/>
      <!-- Paired Grains down the stem -->
      <ellipse cx="198" cy="145" rx="15" ry="24" transform="rotate(-35 198 145)" fill="url(#gold1)" stroke="#ffffff" stroke-width="2"/>
      <ellipse cx="232" cy="160" rx="15" ry="24" transform="rotate(35 232 160)" fill="url(#gold2)" stroke="#ffffff" stroke-width="2"/>
      
      <ellipse cx="194" cy="185" rx="16" ry="25" transform="rotate(-38 194 185)" fill="url(#gold1)" stroke="#ffffff" stroke-width="2"/>
      <ellipse cx="236" cy="200" rx="16" ry="25" transform="rotate(38 236 200)" fill="url(#gold2)" stroke="#ffffff" stroke-width="2"/>

      <ellipse cx="192" cy="225" rx="16" ry="25" transform="rotate(-38 192 225)" fill="url(#gold1)" stroke="#ffffff" stroke-width="2"/>
      <ellipse cx="238" cy="240" rx="16" ry="25" transform="rotate(38 238 240)" fill="url(#gold2)" stroke="#ffffff" stroke-width="2"/>

      <ellipse cx="194" cy="265" rx="15" ry="23" transform="rotate(-35 194 265)" fill="url(#gold1)" stroke="#ffffff" stroke-width="2"/>
      <ellipse cx="236" cy="280" rx="15" ry="23" transform="rotate(35 236 280)" fill="url(#gold2)" stroke="#ffffff" stroke-width="2"/>

      <ellipse cx="198" cy="305" rx="14" ry="20" transform="rotate(-30 198 305)" fill="url(#gold1)" stroke="#ffffff" stroke-width="2"/>
      <ellipse cx="232" cy="318" rx="14" ry="20" transform="rotate(30 232 318)" fill="url(#gold2)" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Right Wheat Spike (Mirrored & Crossing) -->
    <g transform="translate(292, 240) rotate(22) translate(-292, -240)">
      <!-- Stem -->
      <path d="M292 370 Q 292 250 297 110" stroke="#fde68a" stroke-width="6" stroke-linecap="round" fill="none"/>
      <!-- Whiskers/Awns -->
      <path d="M297 110 L287 60 M297 110 L307 60 M297 110 L297 50" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M277 155 L242 130 M317 140 L352 115" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <path d="M272 195 L232 175 M322 180 L362 160" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <path d="M270 235 L227 220 M324 220 L367 205" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <path d="M272 275 L232 265 M322 260 L362 250" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <!-- Top Grain -->
      <ellipse cx="297" cy="110" rx="14" ry="22" transform="rotate(0 297 110)" fill="url(#gold2)" stroke="#ffffff" stroke-width="2"/>
      <!-- Paired Grains down the stem -->
      <ellipse cx="280" cy="160" rx="15" ry="24" transform="rotate(-35 280 160)" fill="url(#gold1)" stroke="#ffffff" stroke-width="2"/>
      <ellipse cx="314" cy="145" rx="15" ry="24" transform="rotate(35 314 145)" fill="url(#gold2)" stroke="#ffffff" stroke-width="2"/>
      
      <ellipse cx="276" cy="200" rx="16" ry="25" transform="rotate(-38 276 200)" fill="url(#gold1)" stroke="#ffffff" stroke-width="2"/>
      <ellipse cx="318" cy="185" rx="16" ry="25" transform="rotate(38 318 185)" fill="url(#gold2)" stroke="#ffffff" stroke-width="2"/>

      <ellipse cx="274" cy="240" rx="16" ry="25" transform="rotate(-38 274 240)" fill="url(#gold1)" stroke="#ffffff" stroke-width="2"/>
      <ellipse cx="320" cy="225" rx="16" ry="25" transform="rotate(38 320 225)" fill="url(#gold2)" stroke="#ffffff" stroke-width="2"/>

      <ellipse cx="276" cy="280" rx="15" ry="23" transform="rotate(-35 276 280)" fill="url(#gold1)" stroke="#ffffff" stroke-width="2"/>
      <ellipse cx="318" cy="265" rx="15" ry="23" transform="rotate(35 318 265)" fill="url(#gold2)" stroke="#ffffff" stroke-width="2"/>

      <ellipse cx="280" cy="318" rx="14" ry="20" transform="rotate(-30 280 318)" fill="url(#gold1)" stroke="#ffffff" stroke-width="2"/>
      <ellipse cx="314" cy="305" rx="14" ry="20" transform="rotate(30 314 305)" fill="url(#gold2)" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Center decorative ribbon / tie -->
    <circle cx="256" cy="365" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
    <path d="M244 372 Q 220 405 210 430" stroke="#fde68a" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M268 372 Q 292 405 302 430" stroke="#fde68a" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Bottom Brand Ribbon Banner -->
  <g filter="url(#glow)">
    <rect x="86" y="410" width="340" height="56" rx="18" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
    <text x="256" y="448" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#064e3b" text-anchor="middle" letter-spacing="2">FEEDCALC PRO</text>
  </g>
</svg>